<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOBILE CARE - Payment & Contact</title>
    <style>
        :root {
            --primary: #2563eb;
            --whatsapp: #25D366;
            --whatsapp-hover: #1da851;
            --upi: #673AB7;
            --upi-hover: #512da8;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --bg: #f3f4f6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            background-image: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 3rem 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 100%;
            max-width: 380px;
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-placeholder {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--primary), #60a5fa);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
            margin: 0 auto 1.2rem;
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.25);
        }
        h1 {
            margin: 0;
            color: var(--text-dark);
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        p {
            color: var(--text-light);
            margin: 0.5rem 0 2.5rem;
            font-size: 1rem;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            margin-bottom: 1.2rem;
            border-radius: 14px;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            color: white;
            box-sizing: border-box;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .btn-wa { background-color: var(--whatsapp); }
        .btn-wa:hover { background-color: var(--whatsapp-hover); }
        
        .btn-upi { background-color: var(--upi); }
        .btn-upi:hover { background-color: var(--upi-hover); }
        
        .icon { 
            width: 24px; 
            height: 24px; 
            fill: currentColor; 
        }
        .footer-text {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 0;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo Initial -->
        <div class="logo-placeholder">M</div>
        
        <h1>SRI SAI ONLINE SERVICES</h1>
        <p>Scan & Connect</p>

        <!-- WhatsApp Button -->
        <a href="https://wa.me/918247709435?text=Hello%20SRI%20SAI," class="btn btn-wa">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.161.453-.834.864-1.161.9-1.015.111-2.436-.453-3.83-1.847-1.393-1.392-1.956-2.813-1.846-3.829.036-.328.448-1 .901-1.16.233-.082.496-.024.664.15l.623.645c.168.174.195.426.06.626l-.323.477c-.135.2-.108.473.064.646l2.133 2.132c.173.172.446.2.646.064l.477-.323c.2-.135.451-.108.625.06l.645.624c.174.168.232.431.15.664z"/>
            </svg>
            Message on WhatsApp
        </a>

        <!-- UPI Button -->
        <a href="upi://pay?pa=8247709435@okbizaxis&pn=SRI%20SAI%20ONLINE%20SERVICES&cu=INR" class="btn btn-upi">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
            Pay via UPI
        </a>
        
        <p class="footer-text">Secure & Direct Designed By Delix</p>
    </div>
</body>
</html>
